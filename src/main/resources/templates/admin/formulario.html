<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{admin/he_fo_ad::head}"></head>

<style>

    body{
        background:#f5f7fb;
        font-family:'Segoe UI', sans-serif;
    }

    /* =========================
       CONTENEDOR PRINCIPAL
    ========================= */

    .admin-container{
        padding:60px 0;
    }

    /* =========================
       CARD PROFESIONAL
    ========================= */

    .form-card{
        background:#fff;
        border:none;
        border-radius:28px;
        padding:35px;
        box-shadow:0 15px 45px rgba(0,0,0,0.08);
        transition:0.3s;
        height:100%;
    }

    .form-card:hover{
        transform:translateY(-4px);
        box-shadow:0 20px 55px rgba(0,0,0,0.10);
    }

    /* =========================
       TITULOS
    ========================= */

    .form-title{
        font-size:28px;
        font-weight:700;
        color:#222;
        margin-bottom:10px;
    }

    .form-subtitle{
        color:#777;
        font-size:15px;
        margin-bottom:30px;
    }

    /* =========================
       LABELS
    ========================= */

    .form-label{
        font-weight:600;
        color:#333;
        margin-bottom:8px;
    }

    /* =========================
       INPUTS
    ========================= */

    .form-control,
    .form-select{
        border:none;
        background:#f5f7fa;
        border-radius:14px;
        padding:14px 16px;
        transition:0.3s;
        box-shadow:none !important;
    }

    .form-control:focus,
    .form-select:focus{
        background:#fff;
        border:1px solid #0dcaf0;
        box-shadow:0 5px 20px rgba(13,202,240,0.15) !important;
    }

    textarea.form-control{
        min-height:120px;
        resize:none;
    }

    /* =========================
       BOTONES
    ========================= */

    .btn-modern{
        width:100%;
        border:none;
        border-radius:16px;
        padding:14px;
        font-weight:600;
        font-size:16px;
        background:#0dcaf0;
        color:#fff;
        transition:0.3s;
        box-shadow:0 10px 25px rgba(13,202,240,0.25);
    }

    .btn-modern:hover{
        transform:translateY(-2px);
        background:#08b4d6;
        box-shadow:0 15px 30px rgba(13,202,240,0.35);
    }

    /* =========================
       PREVIEW IMAGEN
    ========================= */

    .preview-container{
        background:#f8f9fc;
        border-radius:20px;
        padding:20px;
        margin-top:20px;
        text-align:center;
        border:2px dashed #dbe2ea;
    }

    #preview{
        max-width:100%;
        max-height:220px;
        border-radius:18px;
        display:none;
        box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    /* =========================
       FILE INPUT
    ========================= */

    input[type="file"]{
        cursor:pointer;
    }

    /* =========================
       ICON BOX
    ========================= */

    .icon-circle{
        width:65px;
        height:65px;
        background:#f0fbfe;
        border-radius:18px;
        display:flex;
        align-items:center;
        justify-content:center;
        margin-bottom:20px;
        color:#0dcaf0;
        font-size:28px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:992px){

        .form-card{
            margin-bottom:30px;
        }

    }

    @media(max-width:576px){

        .admin-container{
            padding:30px 0;
        }

        .form-card{
            padding:25px;
            border-radius:22px;
        }

        .form-title{
            font-size:24px;
        }

    }

</style>

<body class="d-flex flex-column min-vh-100">

<div th:insert="~{admin/he_fo_ad::header}"></div>

<main class="flex-grow-1">

    <div class="container admin-container">

        <div class="row justify-content-center g-4">

            <!-- =========================
                 FORMULARIO CATEGORIA
            ========================= -->

            <div class="col-lg-4 col-md-6">

                <div class="form-card">

                    <div class="icon-circle">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>

                    <h2 class="form-title">
                        Crear Categoría
                    </h2>

                    <p class="form-subtitle">
                        Agrega nuevas categorías para organizar tus productos.
                    </p>

                    <form th:action="@{/admin/categories}" method="post">

                        <!-- NOMBRE -->
                        <div class="mb-4">

                            <label for="categoryName"
                                   class="form-label">

                                Nombre de la Categoría

                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="categoryName"
                                   name="name"
                                   placeholder="Ej: Lencería Premium"
                                   required>

                        </div>

                        <!-- ESTADO -->
                        <div class="mb-4">

                            <label for="categoryStatus"
                                   class="form-label">

                                Estado

                            </label>

                            <select class="form-select"
                                    id="categoryStatus"
                                    name="status"
                                    required>

                                <option value="ACTIVO">
                                    Activo
                                </option>

                            </select>

                        </div>

                        <!-- BOTON -->
                        <button type="submit"
                                class="btn-modern">

                            <i class="fa-regular fa-share-from-square me-2"></i>
                            Crear Categoría

                        </button>

                    </form>

                </div>

            </div>

            <!-- =========================
                 FORMULARIO PRODUCTO
            ========================= -->

            <div class="col-lg-6 col-md-6">

                <div class="form-card">

                    <div class="icon-circle">
                        <i class="fa-solid fa-box-open"></i>
                    </div>

                    <h2 class="form-title">
                        Crear Producto
                    </h2>

                    <p class="form-subtitle">
                        Completa la información para registrar un nuevo producto.
                    </p>

                    <form th:action="@{/admin/create}"
                          method="post"
                          enctype="multipart/form-data">

                        <!-- CATEGORIA -->
                        <div class="mb-4">

                            <label for="category"
                                   class="form-label">

                                Categoría

                            </label>

                            <select class="form-select"
                                    id="category"
                                    name="categoryId"
                                    required>

                                <option value="">
                                    Seleccionar Categoría
                                </option>

                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}">
                                </option>

                            </select>

                        </div>

                        <!-- NOMBRE -->
                        <div class="mb-4">

                            <label for="name"
                                   class="form-label">

                                Nombre del Producto

                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   name="name"
                                   placeholder="Ej: Conjunto Elegance"
                                   required
                                   autocomplete="off">

                        </div>

                        <!-- DESCRIPCION -->
                        <div class="mb-4">

                            <label for="description"
                                   class="form-label">

                                Descripción

                            </label>

                            <textarea class="form-control"
                                      id="description"
                                      name="description"
                                      placeholder="Describe el producto..."
                                      required
                                      autocomplete="off"></textarea>

                        </div>

                        <!-- PRECIO -->
                        <div class="mb-4">

                            <label for="price"
                                   class="form-label">

                                Precio

                            </label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   id="price"
                                   name="price"
                                   placeholder="Ej: 99.90"
                                   required
                                   autocomplete="off">

                        </div>

                        <!-- IMAGEN -->
                        <div class="mb-3">

                            <label for="image"
                                   class="form-label">

                                Imagen del Producto

                            </label>

                            <input type="file"
                                   class="form-control"
                                   id="image"
                                   name="file"
                                   accept="image/*"
                                   required
                                   onchange="validateFileType(event)">

                            <div id="fileError"
                                 class="text-danger mt-2"></div>

                        </div>

                        <!-- PREVIEW -->
                        <div class="preview-container">

                            <img id="preview"
                                 src="#"
                                 alt="Vista previa">

                        </div>

                        <!-- BOTON -->
                        <button type="submit"
                                class="btn-modern mt-4">

                            <i class="fa-regular fa-share-from-square me-2"></i>
                            Crear Producto

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:insert="~{admin/he_fo_ad::footer}"></div>

<script th:src="@{/js/image.js}" type="text/javascript"></script>

</body>

</html>
