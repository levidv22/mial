<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{admin/he_fo_ad::head}"></head>

<style>

    body{
        background:#f5f7fb;
        font-family:'Segoe UI', sans-serif;
    }

    /* =========================
       CONTENEDOR
    ========================= */

    .edit-wrapper{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:50px 15px;
    }

    /* =========================
       CARD PRINCIPAL
    ========================= */

    .edit-card{
        background:#fff;
        border-radius:28px;
        padding:40px;
        box-shadow:0 20px 50px rgba(0,0,0,0.08);
        width:100%;
        max-width:750px;
        position:relative;
        overflow:hidden;
    }

    /* efecto elegante */
    .edit-card::before{
        content:"";
        position:absolute;
        top:-120px;
        right:-120px;
        width:260px;
        height:260px;
        background:rgba(13,202,240,0.08);
        border-radius:50%;
    }

    /* =========================
       TITULOS
    ========================= */

    .page-title{
        font-size:34px;
        font-weight:700;
        color:#222;
        margin-bottom:10px;
    }

    .page-subtitle{
        color:#777;
        margin-bottom:35px;
    }

    /* =========================
       LABELS
    ========================= */

    .form-label{
        font-weight:600;
        color:#444;
        margin-bottom:10px;
    }

    /* =========================
       INPUTS
    ========================= */

    .form-control,
    .form-select{
        border-radius:16px;
        border:1px solid #e5e7eb;
        padding:14px 16px;
        box-shadow:none !important;
        transition:0.3s;
        font-size:15px;
    }

    .form-control:focus,
    .form-select:focus{
        border-color:#0dcaf0;
        box-shadow:0 0 0 4px rgba(13,202,240,0.12) !important;
    }

    textarea.form-control{
        min-height:120px;
        resize:none;
    }

    /* =========================
       INPUT FILE
    ========================= */

    .file-box{
        border:2px dashed #dbe3ea;
        border-radius:18px;
        padding:25px;
        text-align:center;
        transition:0.3s;
        background:#fafcff;
    }

    .file-box:hover{
        border-color:#0dcaf0;
        background:#f4fdff;
    }

    .file-icon{
        font-size:38px;
        color:#0dcaf0;
        margin-bottom:10px;
    }

    /* =========================
       BOTON
    ========================= */

    .btn-update{
        background:#0dcaf0;
        border:none;
        color:#fff;
        padding:15px 25px;
        border-radius:16px;
        width:100%;
        font-size:16px;
        font-weight:600;
        transition:0.3s;
        box-shadow:0 10px 25px rgba(13,202,240,0.25);
    }

    .btn-update:hover{
        background:#08b4d8;
        transform:translateY(-2px);
    }

    /* =========================
       PREVIEW IMAGEN
    ========================= */

    .preview-container{
        margin-top:20px;
        text-align:center;
    }

    .preview-image{
        width:180px;
        height:180px;
        object-fit:cover;
        border-radius:20px;
        box-shadow:0 10px 25px rgba(0,0,0,0.08);
        border:4px solid #fff;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:768px){

        .edit-card{
            padding:25px;
            border-radius:22px;
        }

        .page-title{
            font-size:28px;
        }

        .preview-image{
            width:140px;
            height:140px;
        }

    }

</style>

<body class="d-flex flex-column min-vh-100">

<div th:insert="~{admin/he_fo_ad::header}"></div>

<main class="flex-grow-1">

    <div class="edit-wrapper">

        <div class="edit-card">

            <!-- TITULO -->
            <div class="text-center">

                <h1 class="page-title">
                    ✨ Actualizar Producto
                </h1>

                <p class="page-subtitle">
                    Modifica la información de tu producto de forma profesional.
                </p>

            </div>

            <!-- FORMULARIO -->
            <form th:action="@{/admin/create}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden"
                       name="id"
                       th:value="${product.id}">

                <div class="row">

                    <!-- CATEGORIA -->
                    <div class="col-md-6 mb-4">

                        <label for="category"
                               class="form-label">

                            Categoría

                        </label>

                        <select class="form-select"
                                id="category"
                                name="categoryId"
                                required
                                autocomplete="off">

                            <option value="">
                                Seleccionar Categoría
                            </option>

                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}"
                                    th:selected="${category.id == product.category.id}">
                            </option>

                        </select>

                    </div>

                    <!-- CODIGO -->
                    <div class="col-md-6 mb-4">

                        <label for="code"
                               class="form-label">

                            Código del Producto

                        </label>

                        <input type="text"
                               class="form-control"
                               id="code"
                               name="code"
                               required
                               autocomplete="off"
                               th:value="${product.code}">

                    </div>

                </div>

                <!-- NOMBRE -->
                <div class="mb-4">

                    <label for="name"
                           class="form-label">

                        Nombre del Producto

                    </label>

                    <input type="text"
                           class="form-control"
                           id="name"
                           name="name"
                           required
                           autocomplete="off"
                           th:value="${product.name}">

                </div>

                <!-- DESCRIPCION -->
                <div class="mb-4">

                    <label for="description"
                           class="form-label">

                        Descripción

                    </label>

                    <textarea class="form-control"
                              id="description"
                              name="description"
                              required
                              autocomplete="off"
                              th:text="${product.description}">
                    </textarea>

                </div>

                <div class="row">

                    <!-- PRECIO -->
                    <div class="col-md-6 mb-4">

                        <label for="price"
                               class="form-label">

                            Precio

                        </label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               id="price"
                               name="price"
                               required
                               autocomplete="off"
                               th:value="${product.price}">

                    </div>

                    <!-- IMAGEN -->
                    <div class="col-md-6 mb-4">

                        <label for="image"
                               class="form-label">

                            Imagen del Producto

                        </label>

                        <div class="file-box">

                            <div class="file-icon">
                                <i class="fa-regular fa-image"></i>
                            </div>

                            <input type="file"
                                   class="form-control"
                                   id="image"
                                   name="file">

                        </div>

                    </div>

                </div>

                <!-- PREVIEW -->
                <div class="preview-container">

                    <img th:if="${product.image != null}"
                         th:src="@{/images/{img}(img=${product.image})}"
                         class="preview-image"
                         alt="Producto">

                </div>

                <!-- BOTON -->
                <div class="mt-4">

                    <button type="submit"
                            class="btn-update">

                        Actualizar Producto
                        <i class="fa-regular fa-pen-to-square ms-2"></i>

                    </button>

                </div>

            </form>

        </div>

    </div>

</main>

<div th:insert="~{admin/he_fo_ad::footer}"></div>

</body>

</html>
