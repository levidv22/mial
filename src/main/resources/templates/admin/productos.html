<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{admin/he_fo_ad::head}"></head>

<style>

    body{
        background:#f5f7fb;
        font-family:'Segoe UI', sans-serif;
    }

    /* =========================
       TITULOS
    ========================= */

    .page-title{
        font-weight:700;
        color:#222;
        margin-bottom:8px;
    }

    .page-subtitle{
        color:#777;
        margin-bottom:35px;
    }

    /* =========================
       SIDEBAR CATEGORIAS
    ========================= */

    .category-card{
        background:#fff;
        border-radius:22px;
        padding:20px;
        box-shadow:0 15px 40px rgba(0,0,0,0.06);
        position:sticky;
        top:20px;
    }

    .category-title{
        font-weight:700;
        color:#222;
        margin-bottom:20px;
    }

    .category-link{
        background:#fff;
        border:1px solid #ececec;
        border-radius:14px;
        padding:12px 15px;
        color:#333 !important;
        text-decoration:none;
        transition:0.3s;
        display:flex;
        align-items:center;
        font-weight:500;
        margin-bottom:10px;
    }

    .category-link:hover{
        background:#0dcaf0;
        color:#fff !important;
        transform:translateX(4px);
        box-shadow:0 10px 20px rgba(13,202,240,0.2);
    }

    /* =========================
       CARD PRINCIPAL
    ========================= */

    .products-card{
        background:#fff;
        border-radius:25px;
        padding:30px;
        box-shadow:0 15px 40px rgba(0,0,0,0.06);
    }

    /* =========================
       TABLA
    ========================= */

    .table-modern{
        margin-bottom:0;
    }

    .table-modern thead{
        background:#f8fafc;
    }

    .table-modern thead th{
        border:none;
        color:#444;
        font-weight:700;
        padding:18px 14px;
        white-space:nowrap;
    }

    .table-modern tbody td{
        vertical-align:middle;
        border-top:1px solid #f1f1f1;
        padding:18px 14px;
        color:#555;
    }

    .table-modern tbody tr{
        transition:0.3s;
    }

    .table-modern tbody tr:hover{
        background:#fafcff;
    }

    /* =========================
       PRODUCTO
    ========================= */

    .product-name{
        font-weight:700;
        color:#222;
    }

    .product-description{
        max-width:240px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
        color:#777;
        font-size:14px;
    }

    /* =========================
       PRECIO
    ========================= */

    .price-badge{
        background:#f0fbff;
        color:#0dcaf0;
        padding:8px 14px;
        border-radius:12px;
        font-weight:700;
        display:inline-block;
    }

    /* =========================
       STOCK
    ========================= */

    .stock-badge{
        background:#eefaf1;
        color:#198754;
        padding:8px 14px;
        border-radius:12px;
        font-weight:600;
    }

    /* =========================
       IMAGEN
    ========================= */

    .product-image{
        width:70px;
        height:70px;
        object-fit:cover;
        border-radius:15px;
        cursor:pointer;
        transition:0.3s;
        box-shadow:0 5px 15px rgba(0,0,0,0.08);
    }

    .product-image:hover{
        transform:scale(1.08);
    }

    /* =========================
       BOTONES
    ========================= */

    .btn-action{
        width:42px;
        height:42px;
        border:none;
        border-radius:12px;
        display:flex;
        align-items:center;
        justify-content:center;
        transition:0.3s;
        font-size:15px;
    }

    .btn-stock{
        background:#f3f4f6;
        color:#555;
    }

    .btn-stock:hover{
        background:#0dcaf0;
        color:#fff;
        transform:translateY(-2px);
    }

    .btn-edit{
        background:#fff7e6;
        color:#f59e0b;
    }

    .btn-edit:hover{
        background:#f59e0b;
        color:#fff;
        transform:translateY(-2px);
    }

    .btn-delete{
        background:#fff0f0;
        color:#dc3545;
    }

    .btn-delete:hover{
        background:#dc3545;
        color:#fff;
        transform:translateY(-2px);
    }

    /* =========================
       MODAL
    ========================= */

    .modal-content{
        border:none;
        border-radius:25px;
        overflow:hidden;
    }

    .modal-body{
        padding:20px;
        background:#fff;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:992px){

        .category-card{
            margin-bottom:25px;
            position:relative;
            top:0;
        }

    }

    @media(max-width:768px){

        .products-card{
            padding:18px;
        }

        .table-modern{
            min-width:900px;
        }

        .page-title{
            font-size:26px;
        }

    }

</style>

<body class="d-flex flex-column min-vh-100">

<div th:insert="~{admin/he_fo_ad::header}"></div>

<main class="flex-grow-1">

    <div class="container py-5">

        <!-- TITULO -->
        <div class="text-center mb-5">

            <h1 class="page-title">
                📦 Gestión de Productos
            </h1>

            <p class="page-subtitle">
                Administra tus productos, categorías y stock de manera profesional.
            </p>

        </div>

        <div class="row g-4">

            <!-- =========================
                 CATEGORIAS
            ========================= -->

            <div class="col-lg-3">

                <div class="category-card">

                    <h5 class="category-title">
                        ❤️ Categorías
                    </h5>

                    <div style="max-height:500px; overflow-y:auto;">

                        <a th:each="category : ${categories}"
                           th:href="@{/admin/products/category/{id}(id=${category.id})}"
                           class="category-link">

                            <i class="fa-solid fa-heart me-2"></i>

                            <span th:text="${category.name}"></span>

                        </a>

                    </div>

                </div>

            </div>

            <!-- =========================
                 PRODUCTOS
            ========================= -->

            <div class="col-lg-9">

                <div class="products-card">

                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">

                        <h4 class="fw-bold mb-2">
                            🛍 Productos Existentes
                        </h4>

                        <span class="text-muted">
                            Total de productos:
                            <strong>[[${#lists.size(products)}]]</strong>
                        </span>

                    </div>

                    <div class="table-responsive">

                        <table class="table table-modern align-middle">

                            <thead>

                            <tr>
                                <th>Producto</th>
                                <th>Descripción</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Imagen</th>
                                <th class="text-center">Acciones</th>
                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="product : ${products}">

                                <!-- PRODUCTO -->
                                <td>

                                    <div class="product-name"
                                         th:text="${product.name}">
                                    </div>

                                </td>

                                <!-- DESCRIPCION -->
                                <td>

                                    <div class="product-description"
                                         th:text="${product.description}">
                                    </div>

                                </td>

                                <!-- PRECIO -->
                                <td>

                                    <span class="price-badge">
                                        S/ [[${product.price}]]
                                    </span>

                                </td>

                                <!-- STOCK -->
                                <td>

                                    <span class="stock-badge">
                                        [[${product.balance}]] unidades
                                    </span>

                                </td>

                                <!-- IMAGEN -->
                                <td>

                                    <img th:src="${product.image != null} ? @{/images/} + ${product.image} : '/images/default.png'"
                                         alt="Producto"
                                         class="product-image"
                                         data-bs-toggle="modal"
                                         data-bs-target="#imageModal"
                                         th:data-bs-img-src="${product.image != null} ? @{/images/} + ${product.image} : '/images/default.png'">

                                </td>

                                <!-- ACCIONES -->
                                <td>

                                    <div class="d-flex justify-content-center gap-2">

                                        <!-- STOCK -->
                                        <a th:href="@{/admin/products/stock/{id}(id=${product.id})}"
                                           class="btn-action btn-stock">

                                            <i class="fa-solid fa-boxes-stacked"></i>

                                        </a>

                                        <!-- EDITAR -->
                                        <a th:href="@{/admin/create/edit/{id}(id=${product.id})}"
                                           class="btn-action btn-edit">

                                            <i class="fa-regular fa-pen-to-square"></i>

                                        </a>

                                        <!-- ELIMINAR
                                        <a th:href="@{/admin/create/delete/{id}(id=${product.id})}"
                                           class="btn-action btn-delete"
                                           onclick="return confirm('¿Deseas eliminar este producto?');">

                                            <i class="fa-regular fa-trash-can"></i>

                                        </a> -->

                                    </div>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<!-- =========================
     MODAL IMAGEN
========================= -->

<div class="modal fade"
     id="imageModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content">

            <div class="modal-body text-center">

                <img id="modalImage"
                     src=""
                     alt="Imagen Ampliada"
                     class="img-fluid rounded-4">

            </div>

        </div>

    </div>

</div>

<div th:insert="~{admin/he_fo_ad::footer}"></div>

</body>

<script th:src="@{/js/modal.js}" type="text/javascript"></script>

</html>
