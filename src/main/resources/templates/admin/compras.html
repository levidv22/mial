<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{admin/he_fo_ad::head}"></head>

<style>
    body {
        background: #f4f6f9;
        font-family: 'Segoe UI', sans-serif;
    }

    /* TITULO */
    .page-title {
        font-weight: 700;
        color: #222;
        margin-bottom: 25px;
    }

    /* CARD PRINCIPAL */
    .panel-card {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        padding: 20px;
    }

    /* TABLA MODERNA */
    .table-modern {
        border: none;
    }

    .table-modern thead {
        background: #f8f9fa;
    }

    .table-modern th {
        border: none !important;
        font-weight: 600;
        color: #444;
        font-size: 14px;
    }

    .table-modern td {
        border-top: 1px solid #f1f1f1;
        vertical-align: middle;
        font-size: 14px;
        color: #333;
    }

    /* LISTAS INTERNAS */
    .list-clean {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .list-clean li {
        padding: 3px 0;
    }

    /* TOTAL */
    .total-badge {
        background: #0dcaf0;
        color: #fff;
        padding: 6px 10px;
        border-radius: 10px;
        font-weight: 600;
        display: inline-block;
    }

    /* IMAGEN */
    .img-thumb {
        width: 55px;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .img-thumb:hover {
        transform: scale(1.08);
    }

    /* BOTON ENVIO */
    .btn-send {
        background: #fff;
        border: 1px solid #0dcaf0;
        color: #0dcaf0;
        border-radius: 10px;
        padding: 6px 10px;
        transition: 0.3s;
    }

    .btn-send:hover {
        background: #0dcaf0;
        color: #fff;
    }

    /* ALERTAS */
    .alert {
        border-radius: 12px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        .panel-card {
            padding: 12px;
        }

        .table {
            font-size: 12px;
        }

        .img-thumb {
            width: 45px;
        }
    }
</style>

<body class="d-flex flex-column min-vh-100">

<div th:insert="~{admin/he_fo_ad::header}"></div>

<main class="flex-grow-1">

    <div class="container my-5">

        <!-- ALERTAS -->
        <div th:if="${success != null}" class="alert alert-success text-center">
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error != null}" class="alert alert-danger text-center">
            <span th:text="${error}"></span>
        </div>

        <!-- CARD -->
        <div class="panel-card">

            <h3 class="page-title text-center">
                📦 Historial de Compras
            </h3>

            <div class="table-responsive">

                <table class="table table-modern table-hover align-middle">

                    <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>WhatsApp</th>
                        <th>Dirección</th>
                        <th>Productos</th>
                        <th>Cant.</th>
                        <th>Total</th>
                        <th>Pago</th>
                        <th>Imagen</th>
                        <th>Envío</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="pedidoAgrupado : ${pedidosAgrupados}">

                        <td th:text="${pedidoAgrupado.name}"></td>
                        <td th:text="${pedidoAgrupado.numero}"></td>
                        <td th:text="${pedidoAgrupado.shippingAddress}"></td>

                        <td>
                            <ul class="list-clean">
                                <li th:each="detalle : ${pedidoAgrupado.detallesPedido}"
                                    th:text="${detalle.product.name}">
                                </li>
                            </ul>
                        </td>

                        <td>
                            <ul class="list-clean">
                                <li th:each="detalle : ${pedidoAgrupado.detallesPedido}"
                                    th:text="${detalle.quantity}">
                                </li>
                            </ul>
                        </td>

                        <td>
                            <span class="total-badge">
                                S/ [[${pedidoAgrupado.totalAmount}]]
                            </span>
                        </td>

                        <td>
                            <img th:src="@{/images/{img}(img=${pedidoAgrupado.imagenPago})}"
                                 class="img-thumb"
                                 data-bs-toggle="modal"
                                 data-bs-target="#imageModal"
                                 th:data-bs-img-src="@{/images/{img}(img=${pedidoAgrupado.imagenPago})}">
                        </td>

                        <td>
                            <div th:each="detalle : ${pedidoAgrupado.detallesPedido}">
                                <img th:src="@{/images/{img}(img=${detalle.product.image})}"
                                     class="img-thumb"
                                     data-bs-toggle="modal"
                                     data-bs-target="#imageModal"
                                     th:data-bs-img-src="@{/images/{img}(img=${detalle.product.image})}">
                            </div>
                        </td>

                        <td>
                            <a th:href="@{/admin/compras/envio/{pedidoId}(pedidoId=${pedidoAgrupado.detallesPedido[0].order.id})}"
                               class="btn btn-send">
                                <i class="fa-solid fa-truck-fast"></i>
                            </a>
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<!-- MODAL -->
<div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center">
                <img id="modalImage" class="img-fluid rounded">
            </div>
        </div>
    </div>
</div>

<div th:insert="~{admin/he_fo_ad::footer}"></div>

</body>

<script th:src="@{/js/modal.js}"></script>

</html>
