<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{he_fo_us::head}"></head>

<style>
    body{
        background:#f8f9fc;
        font-family:'Segoe UI', sans-serif;
    }

    /* CONTENEDOR PRINCIPAL */
    .product-detail{
        background:#fff;
        border-radius:20px;
        box-shadow:0 15px 40px rgba(0,0,0,0.08);
        padding:30px;
    }

    /* IMAGEN */
    .product-img{
        width:100%;
        height:500px;
        object-fit:cover;
        border-radius:18px;
        box-shadow:0 10px 30px rgba(0,0,0,0.1);
        transition:0.3s;
    }

    .product-img:hover{
        transform:scale(1.03);
    }

    /* TITULO */
    .product-title{
        font-size:32px;
        font-weight:700;
        color:#222;
    }

    /* DESCRIPCIÓN */
    .product-desc{
        color:#6c757d;
        font-size:16px;
        margin-top:10px;
        line-height:1.6;
    }

    /* PRECIO */
    .product-price{
        font-size:28px;
        font-weight:700;
        color:#0dcaf0;
    }

    /* STOCK */
    .stock-box{
        display:inline-block;
        padding:10px 15px;
        border-radius:12px;
        font-size:14px;
        margin-top:15px;
    }

    .stock-ok{
        background:#e7f8ff;
        color:#0d6efd;
    }

    .stock-out{
        background:#ffe5e5;
        color:#dc3545;
    }

    /* INPUT CANTIDAD */
    .qty-input{
        width:120px;
        border-radius:12px;
        padding:8px;
        border:1px solid #ddd;
    }

    /* BOTÓN */
    .btn-cart{
        background:#0dcaf0;
        border:none;
        padding:12px 25px;
        border-radius:12px;
        font-weight:600;
        transition:0.3s;
        color:#fff;
    }

    .btn-cart:hover{
        background:#0bbcd6;
        transform:translateY(-2px);
    }

    /* WHATSAPP */
    .btn-whatsapp{
        position:fixed;
        bottom:20px;
        right:20px;
        background:#25D366;
        color:#fff;
        font-size:22px;
        padding:14px;
        border-radius:50%;
        box-shadow:0 5px 20px rgba(0,0,0,0.2);
    }

    /* RESPONSIVE */
    @media(max-width:768px){
        .product-img{
            height:300px;
        }

        .product-title{
            font-size:24px;
        }
    }
</style>

<body class="d-flex flex-column min-vh-100">

<div th:insert="~{he_fo_us::header}"></div>

<main class="flex-grow-1">

    <div class="container my-5">
        <!-- ALERTAS -->
        <div th:if="${success != null}" class="alert alert-success alert-modern">
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error != null}" class="alert alert-danger alert-modern">
            <span th:text="${error}"></span>
        </div>

        <div class="row product-detail align-items-center">

            <!-- IMAGEN -->
            <div class="col-md-6 mb-4">
                <img th:src="@{/images/{image}(image=${product.image})}"
                     class="product-img"
                     alt="Producto">
            </div>

            <!-- INFO -->
            <div class="col-md-6">

                <h1 class="product-title" th:text="${product.name}">
                    Nombre del Producto
                </h1>

                <p class="product-desc" th:text="${product.description}">
                    Descripción del producto
                </p>

                <div class="product-price">
                    S/ <span th:text="${product.price}">0.00</span>
                </div>

                <!-- STOCK -->
                <div th:if="${balance > 0}" class="stock-box stock-ok">
                    ✔ Stock disponible: <strong th:text="${balance}"></strong>
                </div>

                <div th:if="${balance <= 0}" class="stock-box stock-out">
                    ✖ Sin stock disponible
                </div>

                <!-- FORM -->
                <form th:action="@{/order-details/add}" method="post" class="mt-4">

                    <input type="hidden" name="productId" th:value="${product.id}">

                    <label class="fw-bold mb-2">Cantidad</label>
                    <br>

                    <input type="number"
                           id="quantity"
                           name="quantity"
                           value="1"
                           min="1"
                           class="qty-input">

                    <div class="mt-4">

                        <div th:if="${session.username != null}">
                            <button type="submit" class="btn-cart">
                                🛒 Agregar al carrito
                            </button>
                        </div>

                        <div th:if="${session.username == null}">
                            <button type="button" class="btn-cart" onclick="showAlert()">
                                🛒 Añadir al carrito
                            </button>
                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- WHATSAPP -->
    <a href="https://wa.me/51928581983" class="btn-whatsapp" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

</main>

<div th:insert="~{he_fo_us::footer}"></div>

</body>

<script>
    function showAlert() {
        Swal.fire({
            icon: 'warning',
            title: 'Inicia sesión',
            text: 'Debes iniciar sesión para agregar productos al carrito',
            confirmButtonText: 'Ir a login'
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = '/login';
            }
        });
    }
</script>

</html>
