<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{he_fo_us::head}"></head>

<style>
    body {
        background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', sans-serif;
    }

    .card-login {
        background: #fff;
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .card-login:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }

    .logo {
        width: 120px;
    }

    .form-control {
        border-radius: 12px;
        height: 45px;
        border: 1px solid #ddd;
    }

    .form-control:focus {
        box-shadow: none;
        border-color: #0dcaf0;
    }

    .btn-primary {
        border-radius: 12px;
        height: 45px;
        font-weight: 600;
        background: #0dcaf0;
        border: none;
    }

    .btn-primary:hover {
        background: #0bbcd6;
    }

    .input-group-text {
        background: white;
        border-radius: 12px 0 0 12px;
    }

    .toggle-btn {
        border-radius: 0 12px 12px 0;
    }

    @media(max-width: 576px){
        .card-login {
            padding: 25px;
        }
    }
</style>

<body>

<div class="card-login">

    <div class="text-center mb-4">
        <a th:href="@{/home}">
            <img th:src="@{/img/LN_MIAL.png}" class="logo">
        </a>
        <h3 class="mt-3 fw-bold">Bienvenido</h3>
        <p class="text-muted">Inicia sesión en tu cuenta</p>
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label>Correo Electrónico</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-at"></i></span>
                <input type="email" class="form-control" name="username" placeholder="correo@email.com" required>
            </div>
        </div>

        <div class="mb-3">
            <label>Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                <button type="button" class="btn btn-light toggle-btn" onclick="togglePassword()">
                    <i id="toggleIcon" class="fa fa-eye"></i>
                </button>
            </div>
        </div>

        <button class="btn btn-primary w-100 mt-3">Ingresar</button>

    </form>

    <div class="text-center mt-4">
        <small>¿No tienes cuenta?
            <a th:href="@{/register}" class="text-decoration-none fw-bold">Regístrate</a>
        </small>
    </div>

    <div th:if="${param.error}" class="alert alert-danger text-center mt-3">
        Error al iniciar sesión
    </div>

</div>

<script>
    function togglePassword(){
        let input = document.getElementById("password");
        let icon = document.getElementById("toggleIcon");

        if(input.type === "password"){
            input.type = "text";
            icon.classList.replace("fa-eye","fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.replace("fa-eye-slash","fa-eye");
        }
    }
</script>

</body>
</html>
